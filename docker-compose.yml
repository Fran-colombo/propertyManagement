# Property Manager — host 8080 (el 80 del VPS ya está ocupado)
# Panel VPS: Public 10046 -> Inner 8080
# URL: http://69.197.176.243:10046

services:
  backend:
    build:
      context: ./back
    container_name: propertyManager-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./properties_data:/app/properties_data
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
    networks:
      - propertyManager-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./react-ts
      args:
        VITE_API_URL: /api
    container_name: propertyManager-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - propertyManager-net

networks:
  propertyManager-net:
    driver: bridge
